# Default CLI values used when options are omitted.
#
# Precedence is:
#   command line option > environment variable > config.toml > built-in default
#
# Use snake_case keys matching the Python option names.

[defaults]
corpus = "babylm-2026-strict-small"
streaming = false
text_normalization = "lossy-ascii"
train_ratio = 0.8
split_seed = 42
evaluation_partition = "validation"

[clearml]
clearml_project = "language-models-experiments"
clearml_config_file = "clearml.conf"
clearml_connectivity_check = true
clearml_output_uri = "http://localhost:8081"
clearml_tags = []

[model-training]
# pipeline_version defaults to the project version in pyproject.toml.
pipeline_local = true
controller_queue = "services"
add_run_number = true

# Uncomment limits for smoke runs.
# training_limit = 50
# evaluation_limit = 50
# Or pass --limit 50 to apply the same limit to model training and evaluation.
#
# Source dataset splits are merged before project train/validation partitioning.
# Leave source_split unset to merge all available source splits, or set it to a
# source split name such as "train" to restrict the input rows before partitioning.

[query-pipeline]
# pipeline_version defaults to the project version in pyproject.toml.
pipeline_local = true
controller_queue = "services"
add_run_number = true

[optuna]
# Optuna is disabled unless optuna_trials is greater than zero.
# Search specs use:
#   name = float:low:high[:log]
#   name = int:low:high[:step][:log]
#   name = categorical:value1,value2
# Supported names include model_name, smoothing, discount, unigram_weight,
# bigram_weight, trigram_weight, beta_2, beta_3, top_k, query_max_tokens, query_top_k,
# query_decoding, query_temperature, and query_seed.
optuna_trials = 50
optuna_metric = "next_token_accuracy"
optuna_direction = "maximize"
optuna_search = [
   "smoothing=float:1e-4:1.0:log",
   "unigram_weight=float:0:1.0",
   "bigram_weight=float:0:1.0",
   "trigram_weight=float:0:1.0",
#   "discount=float:0.1:0.95",
#   "beta_2=float:0:1.0",
#   "beta_3=float:0:1.0",
]

[tokenizer-training]
# pipeline_version defaults to the project version in pyproject.toml.
pipeline_local = true
controller_queue = "services"
add_run_number = true

# The tokenizer model name defaults to "<corpus>-<tokenizer_algo>-<vocab_size>"
# unless artifact_name is set explicitly.
tokenizer_algo = "sentencepiece"
vocab_size = 1000
sentencepiece_model_type = "unigram"
sentencepiece_character_coverage = 1.0
sentencepiece_hard_vocab_limit = true

[train]
model_name = "trigram-good-turing"
# Model training resolves the latest tokenizer-training run matching
# this tokenizer model name and the configured corpus.
tokenizer_model_name = "babylm-2026-strict-small-sentencepiece-1000"
smoothing = 0.1
unigram_weight = 0.1
bigram_weight = 0.3
trigram_weight = 0.6
# beta_2 and beta_3 can be set together instead of unigram/bigram/trigram weights.
discount = 0.75

[evaluate]
top_k = 5

[query]
prompt = "once upon"
max_tokens = 80
top_k = 10
decoding = "sample"
temperature = 1.0
seed = 1

[corpus_stats]
top_n_lengths = 5
preview_chars = 120
